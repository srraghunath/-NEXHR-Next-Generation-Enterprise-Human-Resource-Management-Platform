services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: employee_db
      MYSQL_USER: ems_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-ems_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./employee-management-system-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/employee_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ems_app
      DB_PASSWORD: ${DB_PASSWORD:-ems_password}
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: false
      JPA_FORMAT_SQL: false
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./employee-management-system-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
